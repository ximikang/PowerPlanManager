name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version used in portable package names
        required: true
        default: 1.0.0
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-portable:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x86, x64, ARM64]
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PowerManager.slnx

      - name: Test core
        if: matrix.platform == 'x64'
        run: dotnet test tests\PowerManager.Core.Tests\PowerManager.Core.Tests.csproj -c Release --no-restore

      - name: Build self-contained portable release
        shell: pwsh
        run: .\scripts\Build-GitHubRelease.ps1 -Platform "${{ matrix.platform }}" -Version "$env:RELEASE_VERSION" -Variant Portable

      - name: Build minimal framework-dependent release
        shell: pwsh
        run: .\scripts\Build-GitHubRelease.ps1 -Platform "${{ matrix.platform }}" -Version "$env:RELEASE_VERSION" -Variant Minimal

      - name: Upload portable release
        uses: actions/upload-artifact@v7
        with:
          name: PowerPlanManager-${{ matrix.platform }}
          path: artifacts/release/*.zip
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-portable
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: PowerPlanManager-*
          merge-multiple: true
          path: release-assets

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assets = @(Get-ChildItem release-assets -Filter *.zip)
          if ($assets.Count -ne 6) {
            throw "Expected six release archives, found $($assets.Count)."
          }
          $notes = @'
          Two downloads are available for each CPU architecture:

          - `portable`: recommended; self-contained and does not require separate .NET or Windows App SDK installation.
          - `minimal`: smaller framework-dependent build; requires .NET 10 Desktop Runtime, Windows App SDK 2.3 Runtime, and Microsoft Visual C++ Redistributable 2015-2022 for the matching architecture.

          Minimal package dependencies: [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0), [Windows App SDK Runtime](https://learn.microsoft.com/windows/apps/windows-app-sdk/downloads), [Visual C++ Redistributable](https://learn.microsoft.com/cpp/windows/latest-supported-vc-redist).

          每种 CPU 架构提供两个版本：

          - `portable`：推荐，自包含，无需单独安装 .NET 或 Windows App SDK。
          - `minimal`：体积更小，需要安装相同架构的 .NET 10 Desktop Runtime、Windows App SDK 2.3 Runtime 和 Microsoft Visual C++ 2015-2022 Redistributable。
          '@
          $notes | Set-Content release-notes.md -Encoding utf8
          gh release create "$env:GITHUB_REF_NAME" $assets.FullName --verify-tag --notes-file release-notes.md --generate-notes --repo "$env:GITHUB_REPOSITORY"
